<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Vibe Grid: temukan tontonan sesuai suasana hatimu di FlipPlay." />
    <title>The Vibe Grid — FlipPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./output.css" />
    <style>
      /* Jumlah kolom grid mengikuti lebar layar */
      .media-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      @media (min-width: 640px) { .media-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (min-width: 1024px) { .media-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      @media (min-width: 1280px) { .media-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
      @media (min-width: 1536px) { .media-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
      @media (min-width: 1920px) { .media-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); } }

      /* Batasi tinggi teks kartu supaya semua kartu rapi */
      .clamp-1, .clamp-2 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
      .clamp-1 { -webkit-line-clamp: 1; line-clamp: 1; }
      .clamp-2 { -webkit-line-clamp: 2; line-clamp: 2; }
    </style>
  </head>
  <body class="bg-page font-['DM_Sans'] text-main antialiased">
    <header class="border-b border-line bg-page">
      <nav
        class="flex w-full items-center justify-between gap-3 px-4 py-3 sm:px-6 sm:py-4 lg:px-10 xl:px-12"
        aria-label="Navigasi utama"
      >
        <a href="./index.html" class="flex items-center gap-2.5" aria-label="FlipPlay, kembali ke beranda">
          <span
            class="grid size-8 place-items-center rounded-xl bg-accent font-['Space_Grotesk'] text-base font-bold text-on-accent sm:size-9 sm:text-lg"
            aria-hidden="true"
          >f.</span>
          <span class="font-['Space_Grotesk'] text-lg font-bold tracking-tight sm:text-xl">flipplay<span class="text-accent">.</span></span>
        </a>
        <a href="./index.html" class="text-sm font-medium text-muted">
          <span class="sm:hidden">← Beranda</span>
          <span class="hidden sm:inline">Kembali ke beranda</span>
        </a>
      </nav>
    </header>

    <main class="w-full px-4 py-6 sm:px-6 sm:py-10 lg:px-10 lg:py-14 xl:px-12">
      <section aria-labelledby="judul-halaman">
        <h1 id="judul-halaman" class="font-['Space_Grotesk'] text-3xl font-semibold leading-tight tracking-tight sm:text-4xl lg:text-5xl">
          The Vibe Grid
        </h1>
        <p class="mt-3 max-w-xl text-sm leading-6 text-muted sm:mt-4 sm:text-base sm:leading-7">
          Cari judul favoritmu, atau pilih Aura sesuai suasana hati dan biarkan kami menyaring tontonannya.
        </p>

        <div class="mt-6 grid min-w-0 gap-5 lg:mt-8 lg:grid-cols-[minmax(0,22rem)_1fr] lg:items-end lg:gap-8">
          <div>
            <label for="search-input" class="mb-2 block text-sm font-medium">Cari judul</label>
            <input 
              id="search-input" 
              type="search"
              placeholder="Contoh: Fullmetal Alchemist"
              autocomplete="off"
              class="min-w-0 w-full rounded-xl border border-line bg-field px-4 py-3 text-base text-main outline-none placeholder:text-subtle focus:border-accent lg:text-sm"
            />
          </div>

          <div class="min-w-0">
            <p id="aura-label" class="mb-2 text-sm font-medium">Pilih Aura</p>
            <div
              id="aura-list"
              class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-1 [scrollbar-width:none] sm:mx-0 sm:flex-wrap sm:overflow-visible sm:px-0 sm:pb-0 [&::-webkit-scrollbar]:hidden"
              role="group"
              aria-labelledby="aura-label"
            >
              <button type="button" data-aura="all" aria-pressed="true" class="aura-btn min-h-11 shrink-0 whitespace-nowrap rounded-full border border-accent bg-accent px-4 py-2 text-sm font-semibold text-on-accent sm:min-h-0">Semua</button>
              <button type="button" data-aura="high-energy" aria-pressed="false" class="aura-btn min-h-11 shrink-0 whitespace-nowrap rounded-full border border-line px-4 py-2 text-sm font-semibold text-main sm:min-h-0">High Energy</button>
              <button type="button" data-aura="melancholy" aria-pressed="false" class="aura-btn min-h-11 shrink-0 whitespace-nowrap rounded-full border border-line px-4 py-2 text-sm font-semibold text-main sm:min-h-0">Melancholy</button>
              <button type="button" data-aura="binge" aria-pressed="false" class="aura-btn min-h-11 shrink-0 whitespace-nowrap rounded-full border border-line px-4 py-2 text-sm font-semibold text-main sm:min-h-0">Binge Mode</button>
            </div>
          </div>
        </div>

        <p id="aura-hint" class="mt-3 text-sm text-subtle"></p>
      </section>

      <section class="mt-8 lg:mt-10" aria-label="Daftar tontonan">
        <p id="result-count" class="mb-4 text-sm text-muted" aria-live="polite"></p>

        <p id="loading-message" class="hidden rounded-2xl border border-line bg-panel p-6 text-sm text-muted" role="status">
          Memuat data tontonan…
        </p>

        <div id="error-box" class="hidden rounded-2xl border border-line bg-panel p-6" role="alert">
          <p id="error-message" class="text-sm text-accent"></p>
          <button
            id="retry-button"
            type="button"
            class="mt-4 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-on-accent"
          >Coba hubungkan lagi</button>
        </div>

        <div id="media-grid" class="media-grid grid gap-3 sm:gap-5"></div>
      </section>
    </main>

    <footer class="w-full px-4 py-7 text-xs text-subtle sm:px-6 sm:py-8 lg:px-10 xl:px-12">
      <p>© 2026 FlipPlay. Data anime dari AniList dan Kitsu.</p>
    </footer>

    <script src="./vibe-grid.js" defer></script>
  </body>
</html>
